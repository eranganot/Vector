name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
          POSTGRES_DB: vector
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vector" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://vector:vector@localhost:5432/vector
      # Integration tests forge audit rows on purpose: they get their own database (STATUS.md, 2026-10-04).
      TEST_DATABASE_URL: postgres://vector:vector@localhost:5432/vector_test
      VECTOR_ENV: test
      LOG_LEVEL: warn
      GIT_SHA: ${{ github.sha }}
      DEMO_PERSONAS: "on"
      DEMO_CONTROLS: "on"
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuv
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm db:migrate
      - run: PGPASSWORD=vector psql -h localhost -U vector -d vector -c "create database vector_test"
      - run: pnpm test:integration
      - run: pnpm demo:reset
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm run doctor
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
