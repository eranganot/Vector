# Local development database. Production/dev/demo use Railway Postgres.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
      POSTGRES_DB: vector
    ports:
      - "5432:5432"
    volumes:
      - vector-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  vector-pg:
